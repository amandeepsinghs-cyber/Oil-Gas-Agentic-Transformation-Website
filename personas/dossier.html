<!-- Every rupee multiplier on this page lives in one sourced sheet, loaded
     first so a caller can override it before anything renders. -->
<script src="../data/value_model.js"></script>
<script src="../data/personas/index.js"></script>
<script>
(function () {
  "use strict";

  /* The roster needs all 33 personas; the body needs exactly one. So the index
     (40 KB) loads up front and each persona's detail (~35 KB) is pulled when
     it is first opened, instead of shipping 1.33 MB to show one role.

     Detail arrives via an injected <script> rather than fetch() on purpose:
     parts of this deck are opened straight from disk, and fetch() is blocked
     by CORS on file:// while a script tag is not. */
  var DATA   = window.PERSONA_INDEX || [];
  var DETAIL = (window.PERSONA_DETAIL = window.PERSONA_DETAIL || {});
  var BY_ID  = DATA.reduce(function (acc, p) { acc[p.id] = p; return acc; }, {});
  var pending = {};

  function loadDetail(id, done) {
    if (DETAIL[id]) return done(DETAIL[id]);
    if (pending[id]) return pending[id].push(done);
    pending[id] = [done];
    var s = document.createElement("script");
    s.src = "../data/personas/" + encodeURIComponent(id) + ".js";
    s.onload = s.onerror = function () {
      var waiting = pending[id] || [];
      delete pending[id];
      waiting.forEach(function (cb) { cb(DETAIL[id] || null); });
    };
    document.head.appendChild(s);
  }

  var rootEl   = document.getElementById("root");
  var stripEl  = document.getElementById("strip");
  var filterEl = document.getElementById("filter-row");
  var countEl  = document.getElementById("counter");
  var backEl   = document.getElementById("back-board");
  var pendingOpenAgent = null;          // ?a=<n>, applied on first paint only

  /* The one Gemini Enterprise workspace this estate is published into -- the
     same address slide 06 already links to. It is a workspace, not a per-agent
     endpoint: none of these 232 agents is individually deployed yet, so the
     card says "see this agent in", never "invoke". */
  var GEMINI_ENTERPRISE_URL = window.GEMINI_ENTERPRISE_URL ||
    "https://vertexaisearch.cloud.google.com/home/cid/7dab71a6-8f69-48ba-841f-492144d75c05?hl=en_US";

  /* ── The value model ───────────────────────────────────────────────────
     Two earlier attempts are worth recording so nobody rebuilds them.

     Scaling by the corpus `freq` tags produced a 6x gap between two roles
     that both hold seven agents, purely because one dossier's workflows
     were tagged "Daily" and the other's "Periodic" -- a labelling artefact,
     not an operational difference. Scaling by each dossier's before/after
     reduction ratio failed the other way: every dossier claims an 85-90%
     cut, so all 33 collapsed into two flat clusters and the number degraded
     into a restatement of "Core 20, or not".

     The missing variable in both was headcount. A refinery board operator
     and a reservoir simulation engineer differ by two orders of magnitude in
     how many people hold the job, and that is what should separate their
     numbers. Headcount also caps the model for free: you cannot free more
     hours than the people in that role actually work.

     Every constant here is an assumption WE supply. All 33 dossiers carry an
     explicit rule -- "never fabricate enterprise rupee/dollar multipliers,
     the customer supplies their own well count and asset valuation
     multiplier" -- so these are deliberately exposed on window rather than
     buried, and printed on the page in the assumptions panel. Rescale the
     whole deck from the console or from a one-line script tag:

          window.VALUE_MODEL = { onTask: 0.35, rate: 3000 };
          window.VALUE_SEATS = { P10: 900 };                */
  var VM = window.VALUE_MODEL || {};
  var VALUE = {
    rate:      VM.rate      || 2500,   // INR per loaded technical-staff hour
    yearHours: VM.yearHours || 1800,   // productive hours per person per year
    onTask:    VM.onTask    != null ? VM.onTask : 0.50,
    scale:     VM.scale     || "combined ONGC + IOCL scale"
  };

  var SEATS  = window.VALUE_SEATS   || {};
  var ASSETS = window.ASSET_CAPITAL || {};
  var RISKS  = window.ASSET_RISK    || {};
  /* The corpus numbers each role's actions A01-A15; the deck shows them as
     WORKFLOW nodes -- P02W03. Two reasons. The workflow is the thesis: a row
     IS one persona's workflow, and a cell is one node in it. And it keeps the
     letter A free for agents (OG-P02-A04), so the two id spaces can no longer
     be confused -- which matters because their numbers do not correspond.
     Display only: the data keeps its A-codes, which are research provenance. */
  function wcode(c) { return "W" + String(c || "").replace(/^A/, ""); }

  var RECOV  = window.RESOURCE_RECOVERY || {};

  /* Crore above a crore, lakh below it. An Indian operator reads "Cr"; a
     rupee figure with eight digits in it reads as noise. */
  function inr(n) {
    if (n == null || !isFinite(n)) return null;
    if (n >= 1e7) return "\u20B9" + (n / 1e7).toFixed(1) + " Cr";
    return "\u20B9" + (n / 1e5).toFixed(1) + " L";
  }

  /* ── The four levers ────────────────────────────────────────────────────
       Names are canonical in data/value_model.js as VALUE_LEVERS. The internal
       term names below read human/asset/risk/recov for historical reasons; the
       displayed names are the only ones that matter to a reader.

       1. PRODUCTIVITY  hours returned to a person x loaded rate   [human]
       2. UPTIME        NPT, downtime, giveaway, deferment held    [asset]
       3. INTEGRITY     probability of a loss event x consequence  [risk]
       4. RECOVERY      barrels found and recovered x margin       [recov]

     One and two are deterministic. Three is an expectation. Four is the only
     one that counts UPWARD, and it is the reason the estate total is no longer
     composed entirely of money not spent. The card keeps them apart because a
     reader is entitled to discount three and four differently, and a single
     blended figure would hide that choice.

     Uptime counts only hours on an asset's CRITICAL PATH, which is what stops
     the same saved hour being banked twice. 12 of the 33 roles carry no uptime
     term, 17 carry no integrity term, and 24 carry no recovery term. Those
     zeros are load-bearing: they are what makes the non-zeros believable.

     Note the structure: no role carries both integrity and recovery. A role
     whose errors MISALLOCATE capital is not a role whose errors DESTROY it. */
  function assetCapital(p) {
    var a = ASSETS[p.id];
    if (!a) return null;
    var v = a.form === "time"
      ? a.units * a.hoursPerYear * a.share * a.ratePerHour
      : a.qtyPerYear * a.share * a.ratePerQty;
    return { inr: v, spec: a };
  }

  function assetRisk(p) {
    var r = RISKS[p.id];
    if (!r) return null;
    var exposure = r.unitsPerYear * r.frequency * r.consequence;
    return {
      inr:      exposure * r.alpha * r.beta,
      exposure: exposure,
      spec:     r
    };
  }

  /* Recovery: the fourth lever, and the only one that counts upward.

     Same five factors as assetRisk deliberately, so a reader who accepted
     that term has already accepted this one's shape:

       barrels = unitsPerYear x bblPerUnit x alpha x beta
       rupees  = barrels x bblMargin

     The barrel count is carried separately and is the harder number. The
     rupees rest on one margin assumption; the barrels rest on stated well
     counts. Lead with barrels if challenged. */
  function resourceRecovery(p) {
    var r = RECOV[p.id];
    if (!r) return null;
    var gross = r.unitsPerYear * r.bblPerUnit;
    var bbl   = gross * r.alpha * r.beta;
    return {
      inr:   bbl * (VALUE.bblMargin || 2500),
      bbl:   bbl,
      gross: gross,
      spec:  r
    };
  }

  /* Squad-level annual value: the four levers, and their sum. */
  function squadValue(p) {
    var vm    = p.valueModel || {};
    var total = vm.total || {};
    var seats = SEATS[p.id];
    if (!seats || !total.beforeHours) return null;

    var reduction = (total.beforeHours - total.afterHours) / total.beforeHours;
    var freedPer  = VALUE.yearHours * VALUE.onTask * reduction;
    var human     = freedPer * seats * VALUE.rate;
    var asset     = assetCapital(p);
    var risk      = assetRisk(p);
    var recov     = resourceRecovery(p);

    return {
      seats:     seats,
      reduction: reduction,
      freedPer:  freedPer,
      freedAll:  freedPer * seats,
      human:     human,
      asset:     asset,
      risk:      risk,
      recov:     recov,
      inr:       human + (asset ? asset.inr : 0) + (risk ? risk.inr : 0) +
                 (recov ? recov.inr : 0)
    };
  }

  /* P16-P22 record no "Unit of Work" column at all -- 49 agents with a blank
     unit. Their total row still names the cycle ("TOTAL PER DAILY
     SURVEILLANCE CYCLE"), so the unit is recoverable from it rather than
     invented, and all 232 cards can state what their hours are per. */
  function unitFor(valueRow, p) {
    var u = valueRow && valueRow.unit;
    if (u) return u.replace(/^1\s+/, "");
    var label = p && p.valueModel && p.valueModel.total && p.valueModel.total.label;
    if (!label) return null;
    var m = /^\s*TOTAL\s+PER\s+(.+?)\s*$/i.exec(label);
    if (!m) return null;
    return m[1].toLowerCase().replace(/\b[a-z]/g, function (c) { return c.toUpperCase(); });
  }

  /* The `friction` tag on every one of the 495 workflows used to be rolled
     up here into a three-class mix (accuracy / toil / risk) and printed on the
     profile. That summary moved to the board, which colours the bottom edge of
     every cell by the same tag across all 33 roles at once. The classifier
     lives in scripts/build_matrix_33.js now -- if you reinstate a per-persona
     mix, take the map from there so the two pages cannot disagree. */


  /* Deck rows A-T predate the research. Keep their deep links working:
     page_08's chessboard links out as ?role=<letter>. Three rows (E mud
     chemist, F directional drilling, R reforming) have no dossier, and
     O/P/Q all collapse into the single refinery process engineer. */
  var DECK_ROW_TO_RESEARCH = {
    A: "P18", B: "P05", C: "P21", D: "P07", E: null,  F: null,  G: "P02",
    H: "P22", I: "P09", J: "P04", K: "P12", L: "P13", M: "P14", N: "P15",
    O: "P16", P: "P16", Q: "P16", R: null,  S: "P28", T: "P19"
  };

  /* Reverse map, first row wins. Only the 17 personas that actually sit on the
     board get a row-specific link back to it. */
  var RESEARCH_TO_DECK_ROW = (function () {
    var m = {};
    Object.keys(DECK_ROW_TO_RESEARCH).forEach(function (row) {
      var pid = DECK_ROW_TO_RESEARCH[row];
      if (pid && !m[pid]) m[pid] = row;
    });
    return m;
  })();

  var current = null;
  var filter  = null;                   // active segment group, null = all
  var query   = "";

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function hours(n) {
    if (n == null) return null;
    return (Math.round(n * 100) / 100).toString().replace(/\.00$/, "");
  }

  // ── Routing ──────────────────────────────────────────────────────────

  function resolveId() {
    var q = new URLSearchParams(window.location.search);
    var pid = q.get("p");
    if (pid && BY_ID[pid.trim().toUpperCase()]) return pid.trim().toUpperCase();
    var role = q.get("role");
    if (role) {
      var mapped = DECK_ROW_TO_RESEARCH[role.trim().toUpperCase()];
      if (mapped && BY_ID[mapped]) return mapped;
    }
    return BY_ID.P04 ? "P04" : (DATA[0] && DATA[0].id);
  }

  // ── Roster ───────────────────────────────────────────────────────────

  /* The dossier segment is finer-grained than is useful in a roster: six of
     the thirteen raw segments hold exactly one persona. Collapse to value-chain
     order. The precise segment still shows on the identity card. */
  var GROUPS = [
    "Subsurface & Geosciences",
    "Wells & Rig Operations",
    "Field & Gathering",
    "Midstream",
    "Downstream Refining",
    "Cross-Cutting"
  ];

  function groupOf(p) {
    var s = p.segment || "";
    if (s.indexOf("Cross-Cutting") === 0) return "Cross-Cutting";
    if (s.indexOf("Midstream") === 0) return "Midstream";
    return GROUPS.indexOf(s) >= 0 ? s : "Other";
  }

  function matches(p, q) {
    if (!q) return true;
    var hay = [p.id, p.title, p.segment, p.person, p.agentFocus]
      .concat(p.aliases || []).concat(p.agentNames || [])
      .join(" ").toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function thumbNode(p, cls, monoCls) {
    var src = p.thumb || p.avatar;
    if (src) {
      return '<img class="' + cls + '" src="' + esc(src) + '" alt="" loading="lazy" ' +
             'onerror="this.outerHTML=\'<span class=&quot;' + monoCls + '&quot;>' +
             esc(p.initials) + '</span>\'">';
    }
    return '<span class="' + monoCls + '">' + esc(p.initials) + "</span>";
  }

  function renderFilters() {
    var counts = {};
    DATA.forEach(function (p) { var g = groupOf(p); counts[g] = (counts[g] || 0) + 1; });

    var chips = '<button class="fchip' + (filter === null ? " active" : "") +
                '" type="button" data-group="">All <span class="fn">' + DATA.length + "</span></button>";

    GROUPS.concat(counts.Other ? ["Other"] : []).forEach(function (g) {
      if (!counts[g]) return;
      chips += '<button class="fchip' + (filter === g ? " active" : "") +
               '" type="button" data-group="' + esc(g) + '">' + esc(g) +
               ' <span class="fn">' + counts[g] + "</span></button>";
    });

    filterEl.innerHTML = chips +
      '<input class="fsearch" id="search" type="search" placeholder="Search roles or agents" ' +
      'aria-label="Search roles or agents" value="' + esc(query) + '">';
  }

  function renderStrip() {
    var shown = DATA.filter(function (p) {
      if (query) return matches(p, query);     // search overrides the filter
      return filter === null || groupOf(p) === filter;
    });

    if (!shown.length) {
      stripEl.innerHTML = '<span class="chip-role" style="padding:8px 2px">No match</span>';
      return;
    }

    stripEl.innerHTML = shown.map(function (p) {
      return '<button class="chip' + (p.id === current ? " active" : "") +
             '" type="button" data-id="' + esc(p.id) + '">' +
               thumbNode(p, "chip-thumb", "chip-mono") +
               '<span class="chip-text">' +
                 '<span class="chip-name">' + esc(p.person || p.title) + "</span>" +
                 '<span class="chip-role">' + esc(p.person ? p.title : p.segment) + "</span>" +
               "</span>" +
             "</button>";
    }).join("");

    var active = stripEl.querySelector(".chip.active");
    if (active && active.scrollIntoView) {
      active.scrollIntoView({ block: "nearest", inline: "center" });
    }
  }

  // ── Agent card ───────────────────────────────────────────────────────

  function specRow(key, val) {
    if (!val) return "";
    return '<div class="spec-row"><span class="spec-key">' + esc(key) + "</span>" +
           '<span class="spec-val">' + esc(val) + "</span></div>";
  }

  function agentCard(a, valueRow, share, p) {
    var saved = valueRow && hours(valueRow.savedHours);
    var unit  = unitFor(valueRow, p);

    /* Money on the face, hours on the inside. The rupee figure is the one
       that travels into a steering committee; the hour figure is the one
       that survives being challenged in it, and it belongs next to the unit
       of work it was measured against. */
    var hoursLine = "";
    if (valueRow && valueRow.beforeHours != null && valueRow.afterHours != null) {
      hoursLine =
        '<p class="hours-line">' +
          "<b>" + hours(valueRow.beforeHours) + " h</b> today &rarr; " +
          "<b>" + hours(valueRow.afterHours) + " h</b> reviewing" +
          (unit ? " &middot; per " + esc(unit) : "") +
        "</p>";
    }

    /* The bifurcation. One aggregate on the face of the card; opened, it has
       to say where that number came from and in what proportion, because the
       three terms are not equally solid. Human and asset capital are banked
       every cycle. Risk is an expectation, and is labelled as one. */
    var derivation = "";
    if (share && share.inr != null && share.squadINR) {
      var sq   = share.squad;
      var line = function (cls, key, val, basis) {
        /* A zero lever is "does not apply", not "worth nothing measurable",
           so it gets an em-dash. Printing "0.0 L" implied we had measured
           something and found it negligible. */
        return '<div class="vrow ' + cls + '">' +
                 '<span class="vrow-key">' + key + "</span>" +
                 '<span class="vrow-val">' + (val ? inr(val) : "\u2014") + "</span>" +
                 '<span class="vrow-basis">' + basis + "</span>" +
               "</div>";
      };

      derivation =
        '<div class="vbreak">' +
          '<div class="vbreak-h">Where the ' + inr(share.inr) + " comes from</div>" +

          line("v-human", "Productivity", share.human,
               esc(hours(sq.freedPer * 1) ? Math.round(sq.freedPer).toLocaleString() : "") +
               " h freed &times; " + sq.seats.toLocaleString() + " people &times; \u20B9" +
               VALUE.rate.toLocaleString() + "/h, at this agent's " +
               (share.pct * 100).toFixed(0) + "% share") +

          (sq.asset
            ? line("v-asset", "Uptime", share.asset,
                   esc(sq.asset.spec.basis) + " &mdash; " + esc(sq.asset.spec.asset).toLowerCase())
            : line("v-zero", "Uptime", 0,
                   "nothing physical waits on this role, so the hours are already fully counted above")) +

          (sq.risk
            ? line("v-risk", "Integrity", share.risk,
                   esc(sq.risk.spec.scenario) + " &mdash; " + inr(sq.risk.exposure) +
                   "/yr exposed, &alpha;" + sq.risk.spec.alpha + " &times; &beta;" +
                   sq.risk.spec.beta + " credited")
            : line("v-zero", "Integrity", 0,
                   "no loss event this role's decisions govern")) +

          (sq.recov
            ? line("v-recov", "Recovery", share.recov,
                   Math.round(sq.recov.bbl * share.pct).toLocaleString() +
                   " bbl/yr &mdash; " + esc(sq.recov.spec.mechanism).toLowerCase() +
                   ", &alpha;" + sq.recov.spec.alpha + " &times; &beta;" +
                   sq.recov.spec.beta + " credited")
            : line("v-zero", "Recovery", 0,
                   "this role does not change which barrels are found or how many are recovered")) +

          '<div class="vrow vrow-total">' +
            '<span class="vrow-key">Total</span>' +
            '<span class="vrow-val">' + inr(share.inr) + "</span>" +
            '<span class="vrow-basis">per year, ' + esc(VALUE.scale) + "</span>" +
          "</div>" +

          '<p class="vbreak-note">' +
            "<b>" + (saved || "\u2014") + " h</b> returned per " + esc(unit || "unit of work") +
            " is the measured figure; the rupees are modelled. " +
            (sq.risk ? "Integrity is an <b>expectation</b>, not a cash saving \u2014 " +
                       "it is banked on average, over years. " : "") +
            (sq.recov ? "Recovery is priced from a single margin assumption; the " +
                        "<b>barrel count</b> is the harder number." : "") +
          "</p>" +
        "</div>";
    }

    /* Mining's card anatomy, adopted wholesale:
         header  -- registry ID badge left, value pill right
         body    -- title, then one line of mechanism
         footer  -- dashed rule, value phrase left, affordance right
       The footer is inside the button and the button is a flex column with
       space-between, so every collapsed card in a row ends on the same line
       however long its description runs. */
    var valuePhrase = (valueRow && valueRow.frictionRemoved) || a.frictionSolved || "";
    var moneyStr    = share && inr(share.inr);

    return (
      '<article class="agent" data-agent="' + a.n + '">' +
        '<button class="agent-head" type="button" aria-expanded="false">' +
          "<span>" +
            '<span class="agent-badges">' +
              (a.agentId ? '<span class="badge-id">' + esc(a.agentId) + "</span>" : "") +
              (moneyStr
                ? '<span class="agent-money">' + moneyStr + "<small>/yr</small></span>"
                : (saved ? '<span class="agent-saved">' + saved + "<small>h saved</small></span>" : "")) +
            "</span>" +
            '<h3 class="agent-title">' + esc(a.name) + "</h3>" +
            '<p class="agent-one-line">' + esc(a.oneLine) + "</p>" +
          "</span>" +
          '<span class="agent-foot-row">' +
            '<span class="agent-value">' + esc(valuePhrase) + "</span>" +
            '<span class="agent-open"></span>' +
          "</span>" +
        "</button>" +
        '<div class="agent-detail">' +
          '<div class="detail-main">' +
            /* Why before how: the friction is the reason the agent exists. */
            (a.frictionSolved ? '<p class="agent-friction">' + esc(a.frictionSolved) + "</p>" : "") +
            '<div class="spec">' +
              specRow("Reads", a.reads) +
              specRow("Does", a.does) +
              specRow("Returns", a.returns) +
            "</div>" +
            hoursLine +
            derivation +
          "</div>" +
          '<div class="detail-side">' +
            (a.stopsAt
              ? '<div class="guard"><span class="guard-key">Stops at</span>' +
                '<span class="guard-val">' + esc(a.stopsAt) + "</span></div>"
              : "") +
            (a.failureModes
              ? '<div class="guard"><span class="guard-key">Safety envelope</span>' +
                '<span class="guard-val">' + esc(a.failureModes) + "</span></div>"
              : "") +
            '<div class="agent-foot">' +
              '<a class="ge-launch" href="' + esc(GEMINI_ENTERPRISE_URL) + '" ' +
                 'target="_blank" rel="noopener noreferrer" ' +
                 'title="Opens the Gemini Enterprise workspace this estate is published into">' +
                '<img class="ge-mark" src="../assets/media/gemini_enterprise_logo.svg" alt="Gemini Enterprise">' +
                '<span class="ge-cta">See this agent</span>' +
                '<span class="ge-arrow" aria-hidden="true">&#8599;</span>' +
              "</a>" +
              '<span class="ge-note">Opens the workspace today; becomes a direct link to this agent once the squad is deployed.</span>' +
            "</div>" +
          "</div>" +
        "</div>" +
      "</article>"
    );
  }

  // ── Narrative blocks ─────────────────────────────────────────────────

  /* The corpus legend, verbatim: "Bucket: B1 (Ours) / B2 (Monolith) /
     B3 (Live Operations)". The split is the whole argument of the page --
     of the work this role owns, only B1 is ours to take. */
  var BUCKETS = {
    B1: { label: "Ours",            gloss: "automatable \u2014 this is where the squad works" },
    B2: { label: "Monolith",        gloss: "locked inside an incumbent system of record" },
    B3: { label: "Live Operations", gloss: "stays human, on the rig or at the board" }
  };

  /* One shift, told twice. The scene is the highest-value agent in the squad,
     because that is the one worth arguing about; TODAY comes verbatim from the
     dossier's action record, WITH THE AGENT from the agent's own spec. */
  function pickScene(p) {
    var rows   = (p.valueModel && p.valueModel.rows) || [];
    var agents = p.agents || [];
    if (!agents.length) return null;

    var bestN = null, best = null;
    rows.forEach(function (r, i) {
      if (r && r.savedHours != null && (best === null || r.savedHours > best.savedHours)) {
        best = r; bestN = i + 1;
      }
    });

    var agent = agents.filter(function (a) { return a.n === bestN; })[0] || agents[0];
    var acts  = (p.actions || []).filter(function (a) { return a.agentRef === agent.n && a.today; });
    var act   = acts[0] || (p.actions || []).filter(function (a) { return a.today; })[0] || null;
    if (!act) return null;

    return { agent: agent, action: act, row: rows[agent.n - 1] || null };
  }

  function sceneBlock(p) {
    var sc = pickScene(p);
    if (!sc) return "";

    var row  = sc.row;
    var foot = "";
    if (row && row.beforeHours != null && row.afterHours != null) {
      foot = '<div class="half-foot"><b>' + hours(row.beforeHours) + " h</b> today &rarr; <b>" +
             hours(row.afterHours) + " h</b> reviewing" +
             (row.unit ? " &middot; per " + esc(row.unit.replace(/^1\s+/, "")) : "") + "</div>";
    }

    return '<section class="block">' +
             '<h2 class="block-h">A day in the life</h2>' +
             '<p class="scene-title">' + esc(sc.action.action || sc.action.label) + "</p>" +
             '<div class="split">' +
               '<div class="half h-today">' +
                 '<div class="half-label">Today</div>' +
                 "<p>" + esc(sc.action.today) + "</p>" +
                 (sc.action.failureMode ? "<p>" + esc(sc.action.failureMode) + "</p>" : "") +
               "</div>" +
               '<div class="half h-agent">' +
                 '<div class="half-label">With the agent</div>' +
                 "<p>" + esc(sc.agent.does) + "</p>" +
                 (sc.agent.returns ? "<p>" + esc(sc.agent.returns) + "</p>" : "") +
                 foot +
               "</div>" +
             "</div>" +
           "</section>";
  }

  /* The rest of the friction, folded away. These are the dossier's own
     action-level records, not invented quotes: what happens today, and how it
     fails when it fails. */
  function frictionBlock(p, sceneCode) {
    var pts = (p.actions || []).filter(function (a) {
      return a.today && a.code !== sceneCode;
    });
    if (!pts.length) return "";

    return '<section class="block">' +
             '<details class="fold">' +
               "<summary>Where the day actually goes &mdash; " + pts.length +
                 " more friction points in this role&rsquo;s record</summary>" +
               '<div class="friction">' +
                 pts.map(function (a) {
                   return '<div class="fpoint">' +
                            '<div class="fp-act">' + esc(a.action || a.label || "") + "</div>" +
                            '<div class="fp-today">' + esc(a.today) + "</div>" +
                            (a.failureMode ? '<div class="fp-fail">' + esc(a.failureMode) + "</div>" : "") +
                            '<div class="fp-meta">' + esc(wcode(a.code)) +
                              (a.freq ? " &middot; " + esc(a.freq) : "") +
                              (a.agentRef ? " &middot; Agent " + esc(a.agentRef) : "") +
                              (a.source ? " &middot; " + esc(a.source) : "") +
                            "</div>" +
                          "</div>";
                 }).join("") +
               "</div>" +
             "</details>" +
           "</section>";
  }

  function mandateBlock(p) {
    var why = p.role && p.role.whyItMatters;
    if (!why) return "";
    return '<div class="id-mandate"><p>' + esc(why) + "</p></div>";
  }

  /* Every rupee on this page is an assumption we supplied, so it is spelled
     out underneath the cards rather than left for someone to reverse-engineer
     in a meeting. Three paragraphs, in the order an unfriendly reader asks
     for them: how it was calculated, who it belongs to, and what it leaves
     out. */
  /* The four levers, side by side, under the squad. This is the framework
     the whole page is arguing for: an agent estate is worth the hours it
     redeploys, the time it returns to assets, the losses it stops happening,
     and the barrels it finds -- four different kinds of number that deserve
     to be read separately.

     The fourth matters disproportionately. The first three all count money
     NOT SPENT, and an arithmetic that can only subtract reads as an
     efficiency programme however the page is worded. Recovery is the only
     term here that counts upward. */
  function bucketStrip(squad) {
    if (!squad) return "";

    var parts = [
      { cls: "b-human", key: "Productivity", v: squad.human,
        sub: "hours redeployed" },
      { cls: "b-asset", key: "Uptime", v: squad.asset ? squad.asset.inr : 0,
        sub: squad.asset ? esc(squad.asset.spec.asset).toLowerCase()
                         : "no asset waits on this role" },
      { cls: "b-risk",  key: "Integrity",    v: squad.risk ? squad.risk.inr : 0,
        sub: squad.risk ? esc(squad.risk.spec.scenario).toLowerCase()
                        : "no loss event this role governs" },
      { cls: "b-recov", key: "Recovery",     v: squad.recov ? squad.recov.inr : 0,
        sub: squad.recov ? Math.round(squad.recov.bbl).toLocaleString() + " bbl a year"
                         : "no barrels turn on this role" }
    ];
    var tot = squad.inr || 1;

    /* A proportional bar rather than a pie or three numbers in a row: the
       reader's question is "which of the three is this role actually about",
       and that is a length comparison. */
    var bar = parts.map(function (x) {
      var pct = Math.max(0, (x.v / tot) * 100);
      return pct > 0
        ? '<span class="bstrip-seg ' + x.cls + '" style="width:' + pct.toFixed(2) + '%"></span>'
        : "";
    }).join("");

    var cells = parts.map(function (x) {
      return '<div class="bcell' + (x.v ? "" : " bcell-zero") + '">' +
               '<span class="bcell-dot ' + x.cls + '"></span>' +
               '<span class="bcell-key">' + x.key + "</span>" +
               '<span class="bcell-val">' + (x.v ? inr(x.v) : "\u2014") + "</span>" +
               '<span class="bcell-sub">' + x.sub + "</span>" +
             "</div>";
    }).join("");

    return '<div class="bstrip">' +
             '<div class="bstrip-h">' +
               "<span>How this squad creates value</span>" +
               '<span class="bstrip-total">' + inr(squad.inr) + " a year</span>" +
             "</div>" +
             '<div class="bstrip-bar">' + bar + "</div>" +
             '<div class="bstrip-cells">' + cells + "</div>" +
           "</div>";
  }

  /* ── Agent portfolio ────────────────────────────────────────────────────
     The squad strip says what KIND of value the role carries. This says
     which agent to build first, which is the question an operator actually
     has to answer, and it says it in the same rupees so the two blocks
     cannot be read as different currencies of argument.

     No new arithmetic. Every figure here is shareFor(), the same split
     already shown on each agent card, so the chart reconciles with the
     cards above it and with the squad total by construction rather than by
     coincidence. The ranking is the deliverable: an operator who disagrees
     with our loaded rate or seat count will change every absolute number on
     this page and almost none of this order.

     Hours are kept alongside the rupees deliberately. The rupee figure is
     derived; the before/after hours are what the dossier actually recorded,
     and they are what a sceptical reader should be able to attack first. */
  function portfolioBlock(p, agents, valueFor, shareFor, squad) {
    if (!squad || !agents || agents.length < 2) return "";

    var items = agents.map(function (a) {
      var row = valueFor(a);
      var sh  = shareFor(a);
      if (!sh) return null;
      return {
        name:   (a.name || (row && row.agent) || "Agent " + a.n),
        share:  sh,
        row:    row,
        unit:   unitFor(row, p)
      };
    }).filter(Boolean);

    if (items.length < 2) return "";

    // Rank by value. This ordering IS the recommendation.
    items.sort(function (x, y) { return y.share.inr - x.share.inr; });

    var top = items[0].share.inr || 1;

    var rows = items.map(function (it, i) {
      var sh = it.share;

      /* Bar width is scaled against the LARGEST agent, not against the squad
         total. Against the total, a seven-agent squad tops out near 20% and
         every bar is a stub; against the leader the shape of the portfolio
         is legible. The percentage label carries the absolute reading. */
      var widthPct = Math.max(2, (sh.inr / top) * 100);

      // Within the bar, the four levers in their canonical order.
      var parts = [
        { cls: "b-human", v: sh.human },
        { cls: "b-asset", v: sh.asset },
        { cls: "b-risk",  v: sh.risk  },
        { cls: "b-recov", v: sh.recov }
      ];
      var denom = sh.inr || 1;
      var segs = parts.map(function (x) {
        var pct = (x.v / denom) * 100;
        return pct > 0
          ? '<span class="pf-seg ' + x.cls + '" style="width:' + pct.toFixed(2) + '%"></span>'
          : "";
      }).join("");

      var r = it.row;
      var sub = "";
      if (r && r.beforeHours != null && r.afterHours != null) {
        sub = "<b>" + hours(r.beforeHours) + " h</b> today &rarr; <b>" +
              hours(r.afterHours) + " h</b> reviewing" +
              (it.unit ? " &middot; per " + esc(it.unit) : "");
      } else if (r && r.frictionRemoved) {
        sub = esc(r.frictionRemoved);
      }

      return '<div class="pf-row">' +
               '<span class="pf-rank">' + (i + 1) + "</span>" +
               '<span class="pf-name">' + esc(it.name) + "</span>" +
               '<span class="pf-val">' + inr(sh.inr) + "</span>" +
               '<span class="pf-bar">' +
                 '<span class="pf-fill" style="width:' + widthPct.toFixed(2) + '%">' +
                   segs +
                 "</span>" +
               "</span>" +
               '<span class="pf-sub">' + sub +
                 (sub ? " &middot; " : "") +
                 Math.round(sh.pct * 100) + "% of the squad</span>" +
             "</div>";
    }).join("");

    /* The note is not boilerplate. The apportionment is the one place this
       chart could mislead, so it is stated at the point of reading rather
       than left to the assumptions block further down. */
    var apportioned = [];
    if (squad.asset) apportioned.push("Uptime");
    if (squad.risk)  apportioned.push("Integrity");
    if (squad.recov) apportioned.push("Recovery");

    var note = "<b>Read this as an order, not a quotation.</b> Productivity is " +
      "split by each agent's own recorded hours, which the dossier states per " +
      "agent. ";
    note += apportioned.length
      ? apportioned.join(", ").replace(/, ([^,]*)$/, " and $1") +
        (apportioned.length > 1 ? " are" : " is") +
        " priced at role level \u2014 they attach to an asset or a loss event, not " +
        "to one agent \u2014 so " + (apportioned.length > 1 ? "they are" : "it is") +
        " apportioned across the squad on the same hours-share. Where an " +
        "operator knows one agent carries more of that exposure than another, " +
        "this is the first number to change."
      : "This role carries no uptime, integrity or recovery term, so every " +
        "rupee above is hours returned.";

    return '<div class="portfolio">' +
             '<div class="pf-h">' +
               "<span>Which agent to build first</span>" +
               '<span class="pf-total">' + items.length + " agents \u00b7 " +
                 inr(squad.inr) + " a year</span>" +
             "</div>" +
             rows +
             '<p class="pf-note">' + note + "</p>" +
           "</div>";
  }


  function assumptionsBlock(p, squad) {
    if (!squad) return "";

    var out = '<div class="assumptions">' +
      "<h4>How the four numbers are built</h4>" +

      "<p>These are gross figures on stated assumptions, and they are meant " +
        "to be. The point is not a precise forecast &mdash; it is a <b>framework " +
        "for measuring agentic transformation</b>: every agent is priced on a " +
        "unit of work the operator already recognises, and the unit numbers are " +
        "where the argument is won. Replace the multipliers with your own and " +
        "the framework still holds.</p>" +

      "<p><b>Productivity.</b> <b>" + squad.seats.toLocaleString() +
        "</b> people in this role at " + esc(VALUE.scale) + " &times; <b>" +
        VALUE.yearHours.toLocaleString() + " h</b> productive a year &times; <b>" +
        Math.round(VALUE.onTask * 100) + "%</b> of that year inside this workflow " +
        "&times; the dossier's own <b>" + Math.round(squad.reduction * 100) +
        "%</b> reduction = <b>" + Math.round(squad.freedPer).toLocaleString() +
        " h</b> per person, <b>" + Math.round(squad.freedAll).toLocaleString() +
        " h</b> across the role. At <b>\u20B9" + VALUE.rate.toLocaleString() +
        "</b> a loaded hour, <b>" + inr(squad.human) + "</b> a year.</p>";

    if (squad.asset) {
      var a = squad.asset.spec;
      out += "<p><b>Uptime.</b> " + esc(a.basis) + " across <b>" +
        (a.form === "time"
          ? a.units.toLocaleString() + " " + esc(a.unitLabel)
          : a.qtyPerYear.toLocaleString() + " " + esc(a.qtyLabel)) +
        "</b> = <b>" + inr(squad.asset.inr) + "</b> a year. " + esc(a.source) +
        " This counts only time on the asset's <b>critical path</b> &mdash; hours " +
        "that were already counted as productivity are not counted again here.</p>";
    } else {
      out += "<p><b>Uptime: nil.</b> Nothing physical waits on this role " +
        "inside the workflows these agents cover, so every hour they return is " +
        "already fully counted as productivity. Booking an uptime saving here " +
        "would be counting the same hour twice.</p>";
    }

    if (squad.risk) {
      var r = squad.risk.spec;
      out += "<p><b>Integrity.</b> " + esc(r.scenario) + ": <b>" +
        r.unitsPerYear.toLocaleString() + " " + esc(r.unitLabel) + "</b> &times; <b>" +
        r.frequency + "</b> events each &times; <b>" + inr(r.consequence) +
        "</b> per event = <b>" + inr(squad.risk.exposure) + "</b> a year exposed. " +
        "Of that, <b>&alpha; " + r.alpha + "</b> is attributed to information or " +
        "decision error and <b>&beta; " + r.beta + "</b> of that slice is credited " +
        "to the agents &mdash; <b>" + inr(squad.risk.inr) + "</b> a year. " +
        esc(r.source) + " <b>&alpha; and &beta; are judgement, not data.</b> This " +
        "term is an expectation: it is banked on average, over years, not every cycle.</p>";
    } else {
      out += "<p><b>Integrity: nil.</b> No loss event turns on this role's " +
        "decisions in a way we are willing to price. Where the failure mode is " +
        "capital <i>misallocated</i> rather than lost &mdash; a mis-picked " +
        "saturation exponent, say &mdash; scoring it as avoided loss would be the " +
        "kind of claim that discredits the rows that are real. " +
        (squad.recov
          ? "That misallocated capital is not lost to the model: it is counted " +
            "below, under recovery, where it belongs."
          : "") + "</p>";
    }

    if (squad.recov) {
      var rc = squad.recov.spec;
      out += "<p><b>Recovery.</b> " + esc(rc.mechanism) + ". <b>" +
        rc.unitsPerYear.toLocaleString() + " " + esc(rc.unitLabel) + "</b> &times; <b>" +
        rc.bblPerUnit.toLocaleString() + " bbl</b> at stake on each = <b>" +
        Math.round(squad.recov.gross).toLocaleString() + " bbl</b> a year in play. " +
        "Of that, <b>&alpha; " + rc.alpha + "</b> is attributed to information or " +
        "decision quality and <b>&beta; " + rc.beta + "</b> of that slice is credited " +
        "to the agents &mdash; <b>" + Math.round(squad.recov.bbl).toLocaleString() +
        " bbl</b> a year, <b>" + inr(squad.recov.inr) + "</b> at &#8377;" +
        (VALUE.bblMargin || 2500).toLocaleString() + " a barrel of contribution. " +
        esc(rc.source) + " <b>&alpha; and &beta; are judgement, not data</b>, and the " +
        "barrel count is the harder of the two numbers &mdash; the rupees rest on a " +
        "single margin assumption, the barrels on stated well counts. " +
        "<b>This is the only term on the page that counts upward.</b></p>";
    } else {
      out += "<p><b>Recovery: nil.</b> This role does not change which barrels " +
        "are found or how many are ultimately recovered. Protecting throughput on " +
        "barrels already discovered is uptime, and it is counted above. Stretching " +
        "recovery across roles it does not belong to is the move that would make " +
        "the other three levers unbelievable.</p>";
    }

    out += "<p><b>The rupees are ours; the hours are the research's.</b> Every " +
      "dossier carries the same standing rule &mdash; <i>never fabricate " +
      "enterprise rupee/dollar multipliers; the customer supplies their own well " +
      "count and asset valuation multiplier</i> &mdash; so the dossiers stop at " +
      "hours per unit of work and every multiplier above is an illustration of " +
      "scale, not a forecast. All of them sit in one sourced sheet, " +
      "<code>data/value_model.js</code>, and rescale in a line: " +
      "<code>window.VALUE_MODEL = { onTask: 0.35 }</code> or " +
      "<code>window.VALUE_SEATS = { " + esc(p.id) + ": " +
      Math.round(squad.seats / 2) + " }</code>. Swap in the operator's own " +
      "numbers and every figure on the page moves with them.</p>";

    return out + "</div>";
  }


  function workBlock(p) {
    var actions = p.actions || [];
    if (!actions.length) return "";

    /* counts still feeds the section note ("N are ours to automate"). */
    var counts = { B1: 0, B2: 0, B3: 0 };
    actions.forEach(function (a) { if (counts[a.bucket] != null) counts[a.bucket]++; });

    var rows = actions.map(function (a) {
      return '<li class="work-row">' +
               '<span class="work-code">' + esc(wcode(a.code)) + "</span>" +
               '<span class="work-act">' + esc(a.action || a.label || "") + "</span>" +
               '<span class="work-freq">' + esc(a.freq || "") + "</span>" +
               '<span class="bucket-chip seg-' + esc(a.bucket || "") + '">' +
                 esc((BUCKETS[a.bucket] || {}).label || a.bucket || "\u2014") + "</span>" +
               '<span class="work-agent">' + (a.agentRef ? "Agent " + esc(a.agentRef) : "") + "</span>" +
             "</li>";
    }).join("");

    /* The bucket split and the friction mix both used to be summarised here,
       as a proportional bar and a dot legend. They now live on the board
       (working_deck/pages/page_07.html), which reads all 33 roles at once
       and is the right place for a distribution. Repeating them per-persona
       said nothing the workflow list below doesn't already say, one row at
       a time and with the action attached. */

    return '<section class="block">' +
             '<div class="section-head">' +
               "<h2>The work this role owns</h2>" +
               '<span class="section-note">' + actions.length + " workflows. " +
                 (counts.B1 ? "<b>" + counts.B1 + "</b> are ours to automate." : "") +
               "</span>" +
             "</div>" +
             '<details class="fold"><summary>All ' + actions.length + " workflows</summary>" +
               '<ol class="work-list">' + rows + "</ol>" +
             "</details>" +
           "</section>";
  }

  function limitsBlock(p) {
    var notOwned = (p.role && p.role.notOwned) || [];
    var line = p.line || "";
    if (!notOwned.length && !line) return "";

    var owned = notOwned.length
      ? '<div><h3 class="narr-h3">Not this role\u2019s call</h3><ul class="no-list">' +
          notOwned.map(function (n) {
            return "<li><span>" + esc(n.task) + "</span><b>" + esc(n.owner) + "</b></li>";
          }).join("") +
        "</ul></div>"
      : "";

    var honest = line
      ? '<div class="the-line"><h3 class="narr-h3">The honest limit</h3><p>' + esc(line) + "</p></div>"
      : "";

    return '<section class="block">' +
             '<div class="section-head"><h2>Where the squad stops</h2>' +
               '<span class="section-note">Every agent hands back. These are the calls it never makes.</span>' +
             "</div>" +
             '<div class="limits">' + owned + honest + "</div>" +
           "</section>";
  }

  // ── Persona ──────────────────────────────────────────────────────────

  /* Two steps: the roster and the chrome paint from the index immediately,
     while this persona's detail file is still in flight. */
  function renderPersona(id) {
    if (!BY_ID[id]) {
      rootEl.innerHTML = '<p class="empty">No research dossier for that role yet.</p>';
      return;
    }
    current = id;

    var idx = DATA.findIndex(function (p) { return p.id === id; });
    countEl.textContent = (idx >= 0 ? String(idx + 1).padStart(2, "0") : "\u2014") + " / " + DATA.length;

    /* Every one of the 33 personas is on the board now, so the old
       RESEARCH_TO_DECK_ROW indirection is dead here. It mapped research ids to
       the PREVIOUS board's twenty rows, which were lettered A-T; the new board
       is keyed P01-P33 and has no #row-E to jump to. Sixteen roles used to get
       no link at all.

       ?p= rather than #row= because the board's deep-link handler activates
       and scrolls to the row, where a bare anchor only scrolls. */
    backEl.href = "../working_deck/pages/page_07.html?p=" + encodeURIComponent(id);
    backEl.title = "Show " + id + " on the board";

    if (filter !== null && groupOf(BY_ID[id]) !== filter) filter = groupOf(BY_ID[id]);
    renderFilters();
    renderStrip();

    document.title =
      (BY_ID[id].person ? BY_ID[id].person + " \u00b7 " : "") +
      BY_ID[id].title + " \u2014 Persona Deep Dive";

    loadDetail(id, function (p) {
      if (current !== id) return;            // user moved on while it loaded
      if (!p) {
        rootEl.innerHTML = '<p class="empty">Could not load ' + esc(id) +
          '. Run <code>python3 scripts/extract_persona_research.py</code>.</p>';
        return;
      }
      paintPersona(p);
    });
  }

  function paintPersona(p) {
    var vm     = p.valueModel || {};
    var total  = vm.total || {};
    var rows   = vm.rows || [];
    var agents = p.agents || [];

    /* Section 5 lists one value row per agent, in agent order, but its labels
       are written independently of the section 4 agent names -- pair by
       position, which is verified to hold for all 33. */
    function valueFor(a) { return rows[a.n - 1] || null; }

    /* The squad figure is computed once, then split across the agents by each
       one's share of the dossier's own saved hours. Splitting a whole rather
       than pricing each agent separately means the seven cards always sum
       back to the squad number -- there is no residue to explain away.

       All three terms use the same share. For human capital that is exact.
       For asset capital and risk it is an apportionment: the dossier does not
       say which agent carries how much of a rig hour or a containment event,
       so hours-share is the only defensible divider available, and the card
       shows the squad-level basis rather than pretending otherwise. */
    var squad     = squadValue(p);
    var rowsHours = rows.reduce(function (s, r) { return s + ((r && r.savedHours) || 0); }, 0);

    function shareFor(a) {
      if (!squad || !rowsHours) return null;
      var r   = valueFor(a);
      var pct = ((r && r.savedHours) || 0) / rowsHours;
      return {
        pct:      pct,
        inr:      squad.inr * pct,
        human:    squad.human * pct,
        asset:    squad.asset ? squad.asset.inr * pct : 0,
        risk:     squad.risk  ? squad.risk.inr  * pct : 0,
        recov:    squad.recov ? squad.recov.inr * pct : 0,
        squad:    squad,
        squadINR: squad.inr
      };
    }


    var savedTotal = hours(total.savedHours);
    var scene      = pickScene(p);

    /* The face of the card is the money, not the hours. Hours are one of the
       four levers -- productivity -- and leading with them quietly claimed
       that the whole case is a timesheet argument. It is not: for most roles
       uptime, integrity or recovery is the larger term, and twelve roles
       carry no uptime at all. The hour figure still appears, as the basis
       line underneath and on every agent card, where it can be challenged
       next to the unit of work it was measured against. */
    var squadINR = squad && squad.inr ? inr(squad.inr) : null;

    var figure = (squadINR || savedTotal)
      ? '<div class="figure">' +
          '<div class="figure-key">' + (squadINR ? "Annual value" : "Saved per cycle") + "</div>" +
          '<div class="figure-val">' + (squadINR || (savedTotal + " h")) + "</div>" +
          '<div class="figure-sub">' +
            (squadINR
              ? "across four levers" +
                (savedTotal
                  ? "<br>" + savedTotal + " h saved per " +
                    esc(total.unit ? total.unit.replace(/^1\s+/, "").replace(/^per\s+/i, "") : "cycle")
                  : "")
              : esc(total.unit ? "per " + total.unit.replace(/^1\s+/, "") : "per cycle") +
                (total.derived ? " (computed)" : "")) +
          "</div>" +
        "</div>"
      : "";

    var standards = (p.standards || []).map(function (s) { return s.key; }).filter(Boolean);

    rootEl.innerHTML =
      '<section class="idcard">' +
        '<div class="portrait-col">' +
          (p.avatar || p.thumb
            ? '<img class="portrait" src="' + esc(p.avatar || p.thumb) + '" alt="" ' +
              'onerror="this.outerHTML=\'<span class=&quot;portrait-mono&quot;>' +
              esc(p.initials) + '</span>\'">'
            : '<span class="portrait-mono">' + esc(p.initials) + "</span>") +
          figure +
        "</div>" +
        '<div class="idhead">' +
          '<div class="idmeta">' +
            '<span class="tag tag-id">' + esc(p.id) + "</span>" +
            (p.core20 ? '<span class="tag tag-core">Core 20</span>' : "") +
            '<span class="tag tag-live">' + agents.length + " agents in the squad</span>" +
            '<span class="tag tag-segment">' + esc(p.segmentLong || p.segment) + "</span>" +
          "</div>" +
          // Name first, then profession. If a persona has no illustrative
          // name, the role becomes the H1 so the heading is never empty.
          (p.person
            ? "<h1>" + esc(p.person) + "</h1>" +
              '<p class="id-role">' + esc(p.title) + "</p>"
            : "<h1>" + esc(p.title) + "</h1>") +
          '<p class="id-line">' + esc(p.role && p.role.oneLine) + "</p>" +
          mandateBlock(p) +
        "</div>" +
      "</section>" +

      /* Order is deliberate: the agents are what the reader came for, so the
         only thing between the person and the squad is the work bar -- ten
         lines that say how much of this role is even ours to take. The scene
         and the friction record follow as evidence, not as a preamble. */
      workBlock(p) +

      '<section class="block">' +
        '<div class="section-head">' +
          "<h2>The squad</h2>" +
          '<span class="section-note">' +
            (squad
              ? "<b>" + inr(squad.inr) + "</b> a year at " + esc(VALUE.scale) +
                ". Open a card for the hours behind the figure, and where the agent stops."
              : "Each agent takes one workflow. Open a card for what it reads, does, " +
                "returns &mdash; and where it stops.") +
          "</span>" +
        "</div>" +
        '<div class="squad">' +
          agents.map(function (a) {
            return agentCard(a, valueFor(a), shareFor(a), p);
          }).join("") +
        "</div>" +
        bucketStrip(squad) +
        portfolioBlock(p, agents, valueFor, shareFor, squad) +
        assumptionsBlock(p, squad) +
      "</section>" +

      sceneBlock(p) +
      frictionBlock(p, scene && scene.action ? scene.action.code : null) +

      limitsBlock(p) +

      '<p class="provenance">' +
        "<b>" + esc(p.person || p.title) + "</b> \u00b7 " +
        (p.person ? esc(p.title) + " \u00b7 " : "") +
        agents.length + " agents \u00b7 " +
        (p.actions || []).length + " workflows \u00b7 " +
        (p.citations || []).length + " citations" +
        (standards.length ? " \u00b7 " + esc(standards.join(", ")) : "") +
        (p.governingStandards ? " \u00b7 " + esc(p.governingStandards) : "") +
      "</p>";

    window.scrollTo({ top: 0, behavior: "auto" });

    if (pendingOpenAgent) {
      var card = rootEl.querySelector('.agent[data-agent="' + pendingOpenAgent + '"]');
      pendingOpenAgent = null;              // one-shot: only on first paint
      if (card) {
        card.classList.add("is-open");
        card.querySelector(".agent-head").setAttribute("aria-expanded", "true");
      }
    }
  }

  // ── Events ───────────────────────────────────────────────────────────

  stripEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".chip");
    if (!btn) return;
    var id = btn.getAttribute("data-id");
    history.pushState({ id: id }, "", "?p=" + id);
    renderPersona(id);
  });

  filterEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".fchip");
    if (!btn) return;
    var g = btn.getAttribute("data-group");
    filter = g || null;
    query = "";
    renderFilters();
    renderStrip();
  });

  filterEl.addEventListener("input", function (e) {
    if (e.target.id !== "search") return;
    query = (e.target.value || "").trim().toLowerCase();
    renderStrip();
  });

  rootEl.addEventListener("click", function (e) {
    /* The launch link lives inside the card's own click target. Without this,
       opening Gemini Enterprise would also collapse the card behind it. */
    if (e.target.closest(".ge-launch")) return;
    var head = e.target.closest(".agent-head");
    if (!head) return;
    var card = head.closest(".agent");
    var open = card.classList.toggle("is-open");
    head.setAttribute("aria-expanded", open ? "true" : "false");
  });

  window.addEventListener("popstate", function () { renderPersona(resolveId()); });

  document.getElementById("theme-btn").addEventListener("click", function () {
    var dark = document.documentElement.classList.toggle("theme-dark");
    document.documentElement.classList.toggle("theme-light", !dark);
    this.textContent = dark ? "Light" : "Dark";
    try { localStorage.setItem("deck-theme", dark ? "dark" : "light"); } catch (err) { /* private mode */ }
  });

  /* Theme: ?theme=dark|light wins over the stored preference, so a link can
     pin the theme (e.g. when opened from a dark deck page). */
  (function () {
    var forced = new URLSearchParams(location.search).get("theme");
    var stored = null;
    try { stored = localStorage.getItem("deck-theme"); } catch (err) { /* private mode */ }
    var dark = forced ? forced === "dark" : stored === "dark";
    document.documentElement.classList.toggle("theme-dark", dark);
    document.documentElement.classList.toggle("theme-light", !dark);
    document.getElementById("theme-btn").textContent = dark ? "Light" : "Dark";
  })();

  // ── Boot ─────────────────────────────────────────────────────────────

  if (!DATA.length) {
    rootEl.innerHTML =
      '<p class="empty">Persona index unavailable. Run ' +
      "<code>python3 scripts/extract_persona_research.py</code> to generate it.</p>";
  } else {
    /* ?a=<n> deep-links to one agent, opened. It has to wait for the detail
       file: the card it points at does not exist until the persona paints. */
    var want = new URLSearchParams(location.search).get("a");
    if (want) pendingOpenAgent = String(Number(want));

    var first = resolveId();
    filter = groupOf(BY_ID[first]);      // land among peers, not in all 33
    renderPersona(first);
  }
})();
</script>

</body>
</html>
