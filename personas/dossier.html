<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Deep Dive — Agentic Transformation</title>

<!--
  PERSONA DOSSIER — the merged page.

  Shell, voice and the today/with-the-agent device come from the original
  persona.html. The squad, the work bar and the Gemini Enterprise launch come
  from profile.html. The data underneath is the research corpus: 33 personas,
  232 agents, 495 operational actions, generated by
  scripts/extract_persona_research.py into data/personas/.

  Data:   ../data/personas/index.js  (40 KB, all 33)
        + ../data/personas/Pnn.js    (~35 KB, loaded on demand)

  Palette is the official Google Cloud brand set ("Color", under Google Cloud
  brand identity -- there is no "Aurora" palette; that was a misnomer):
    Blue 500 #3186FF · Purple #4B31E3 · Green 500 #00AF57
    Yellow 500 #FEC700 · Red 500 #FC413D
    Grey 10 #F8F9FC · Grey 1200 #121317

  Colour discipline, per the standing instruction that yellow and red are
  reserved for the chessboard (friction / critical):
    - no yellow and no red appear on this page;
    - "today" is neutral, "with the agent" is green;
    - the guard blocks (stops at / safety envelope) are neutral surfaces with
      a DASHED border -- the boundary idiom -- rather than warning colours.
  Both are single-token flips if that decision changes.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap">

<style>
  :root {
    /* Google Cloud core */
    --g-blue:        #3186FF;
    --g-purple:      #4B31E3;
    --g-green:       #00AF57;
    /* AA companion. #00AF57 is 2.89:1 on white and fails even the 3:1 graphic
       floor, so the 500 is for rails/fills and this is for any text. */
    --green-ink:     #007F3F;
    --g-cyan:        #12B5CB;   /* Recovery. Google data-viz cyan: the only
                                   remaining brand hue once red and yellow are
                                   reserved for the chessboard. */
    --g-yellow:      #FEC700;   /* defined, deliberately unused here */
    --g-red:         #FC413D;   /* defined, deliberately unused here */
    --g-grey-10:     #F8F9FC;
    --g-grey-1200:   #121317;

    /* Light theme — the default. "Build from white." */
    /* Repointed from var(--g-grey-10) #F8F9FC to #F0F5FE -- the Cloud Console
       CM3 backdrop token -- so persona pages sit on the same ground as the deck. */
    --canvas:        #F0F5FE;
    --surface:       #FFFFFF;
    --surface-sunk:  #F1F3F9;
    --border:        #E1E5EE;
    --border-strong: #CBD2E0;
    --text:          #1F2430;
    --text-muted:    #5A6275;
    --text-dim:      #8A92A6;
    --accent:        var(--g-blue);
    --accent-soft:   rgba(49, 134, 255, 0.10);
    --purple-soft:   rgba(75, 49, 227, 0.10);
    --green-soft:    rgba(0, 175, 87, 0.12);
    --shadow-sm:     0 1px 2px rgba(18, 19, 23, 0.06);
    --shadow-md:     0 2px 8px rgba(18, 19, 23, 0.08);
    --shadow-lg:     0 8px 28px rgba(18, 19, 23, 0.12);
    --ring:          0 0 0 3px rgba(49, 134, 255, 0.28);

    --font: "Google Sans", "Google Sans Text", -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Consolas, monospace;

    /* One type scale. Nine sizes, no more. */
    --fs-10: 10px; --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
    --fs-16: 16px; --fs-20: 20px; --fs-28: 28px; --fs-40: 40px;

    --radius:   14px;
    --radius-s: 10px;
    --wrap:     1560px;
  }

  html.theme-dark {
    --canvas:        var(--g-grey-1200);
    --surface:       #1A1C22;
    --surface-sunk:  #15171C;
    --border:        #2A2D36;
    --border-strong: #3A3E4A;
    --text:          #ECEEF3;
    --text-muted:    #A8AFC0;
    --text-dim:      #757D91;
    --accent:        #6BA6FF;
    --accent-soft:   rgba(107, 166, 255, 0.14);
    --purple-soft:   rgba(139, 120, 255, 0.16);
    --green-soft:    rgba(0, 175, 87, 0.20);
    /* dark-mode companion: #007F3F is unreadable on #1A1C22, this is 7.0:1 */
    --green-ink:     #5BB974;
    --shadow-sm:     0 1px 2px rgba(0, 0, 0, 0.40);
    --shadow-md:     0 2px 8px rgba(0, 0, 0, 0.45);
    --shadow-lg:     0 8px 28px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font-family: var(--font);
    font-size: var(--fs-14);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--accent); }

  :focus-visible { outline: none; box-shadow: var(--ring); border-radius: 6px; }

  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.5vw); }

  /* ── Masthead ─────────────────────────────────────────────────────
     Institutional chrome. This page is a drill-down from the deck, so it
     carries the deck's identity rather than its own product-style header. */

  .masthead {
    position: sticky; top: 0; z-index: 60;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .masthead-in {
    max-width: var(--wrap); margin: 0 auto;
    padding: 0 max(20px, 2.5vw);
    height: 56px;
    display: flex; align-items: center; gap: 16px;
  }

  .mast-brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .mast-logo  { height: 26px; width: auto; display: block; }
  .mast-div   { width: 1px; height: 18px; background: var(--border-strong); }

  .mast-kicker {
    font-family: var(--mono); font-size: var(--fs-11); font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted);
  }

  .mast-spacer { flex: 1; }

  .mast-nav { display: flex; align-items: center; gap: 12px; }

  .mast-btn {
    font-size: var(--fs-12); font-weight: 600;
    color: var(--text-muted); text-decoration: none;
    padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    cursor: pointer; font-family: inherit;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .mast-btn:hover { border-color: var(--accent); color: var(--accent); }

  .mast-count {
    font-family: var(--mono); font-size: var(--fs-13); font-weight: 700;
    color: var(--accent);
  }

  .mast-cta {
    font-size: var(--fs-12); font-weight: 600; text-decoration: none;
    color: var(--surface); background: var(--text);
    padding: 7px 16px; border-radius: 999px;
  }
  .mast-cta:hover { opacity: 0.88; }

  /* ── Topline ──────────────────────────────────────────────────────
     Outside the persona root, so it survives every in-place switch: the
     argument does not change when the role does. */

  .topline { padding: 34px 0 22px; border-bottom: 1px solid var(--border); }

  .topline-eyebrow {
    font-family: var(--mono); font-size: var(--fs-11); font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 12px;
  }

  .topline-title {
    font-size: clamp(28px, 3.4vw, 40px); font-weight: 600;
    letter-spacing: -0.02em; line-height: 1.16;
    margin: 0; color: var(--text);
  }

  /* The estate-level standfirst and the four-lever method note used to live
     here. Removed: the argument is estate-wide, so repeating it on all 33
     dossiers buried the person the page is actually about. The board (slide
     09) carries the estate strip; each dossier still argues the four levers
     in its own numbers, which is the same case made concretely. */

  /* ── Roster: filter chips over a scrolling face strip ─────────────
     33 roles in a flat strip is five screens of blind dragging. The filter
     defaults to the open persona's own segment, so you land among peers with
     nothing to scroll; "All 33" stays one click away. */

  .roster {
    position: sticky; top: 56px; z-index: 50;
    background: color-mix(in srgb, var(--canvas) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 12px 0 10px;
  }

  .roster-in { max-width: var(--wrap); margin: 0 auto; padding: 0 max(20px, 2.5vw); }

  .filter-row {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    margin-bottom: 10px;
  }

  .fchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); cursor: pointer;
    font: inherit; font-size: var(--fs-12); font-weight: 500;
    transition: border-color 150ms ease, color 150ms ease, background 150ms ease;
  }
  .fchip:hover { border-color: var(--accent); color: var(--accent); }
  .fchip .fn { font-family: var(--mono); font-size: var(--fs-10); color: var(--text-dim); }
  .fchip.active { background: var(--text); border-color: var(--text); color: var(--canvas); }
  .fchip.active .fn { color: var(--canvas); opacity: 0.65; }

  .fsearch {
    margin-left: auto;
    width: 200px; height: 30px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--text);
    font: inherit; font-size: var(--fs-12);
  }
  .fsearch::placeholder { color: var(--text-dim); }
  .fsearch:focus { outline: none; border-color: var(--accent); box-shadow: var(--ring); }

  .strip {
    display: flex; gap: 7px; overflow-x: auto;
    padding: 3px 2px 8px;
    scroll-behavior: smooth; scroll-snap-type: x proximity;
  }
  .strip::-webkit-scrollbar { height: 5px; }
  .strip::-webkit-scrollbar-track { background: transparent; }
  .strip::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .strip:hover::-webkit-scrollbar-thumb { background: var(--text-dim); }

  .chip {
    position: relative; scroll-snap-align: center;
    display: inline-flex; align-items: center; gap: 9px; flex: 0 0 auto;
    padding: 5px 14px 5px 5px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; text-align: left; font: inherit;
    transition: border-color 150ms ease, transform 150ms ease, background 150ms ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

  .chip-thumb {
    width: 30px; height: 30px; border-radius: 999px; flex: none;
    object-fit: cover; object-position: center top;
    background: var(--surface-sunk);
  }

  .chip-mono {
    display: grid; place-items: center;
    width: 30px; height: 30px; border-radius: 999px; flex: none;
    background: linear-gradient(135deg, var(--g-blue) 0%, var(--g-purple) 100%);
    color: #FFFFFF; font-size: var(--fs-11); font-weight: 600;
  }

  .chip-text  { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
  .chip-name  { font-size: var(--fs-13); font-weight: 600; white-space: nowrap; }
  .chip-role  { font-size: var(--fs-10); color: var(--text-dim); white-space: nowrap; }

  .chip.active { background: var(--accent); border-color: var(--accent); }
  .chip.active .chip-name,
  .chip.active .chip-role { color: #FFFFFF; }
  .chip.active .chip-role { opacity: 0.82; }

  /* ── Identity card ────────────────────────────────────────────────
     One row, two cells. The portrait column also carries the value figure so
     the photo, the number and the card's own left rule share a left edge. */

  .idcard {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    column-gap: 26px;
    align-items: start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 26px 28px;
    margin: 24px 0 18px;
    box-shadow: var(--shadow-sm);
  }

  .portrait-col { grid-column: 1; }

  .portrait {
    width: 116px; height: 116px; display: block;
    border-radius: 18px; object-fit: cover; object-position: center top;
    box-shadow: var(--shadow-md);
  }

  .portrait-mono {
    display: grid; place-items: center;
    width: 116px; height: 116px; border-radius: 18px;
    background: linear-gradient(135deg, var(--g-blue) 0%, var(--g-purple) 100%);
    color: #FFFFFF; font-size: var(--fs-28); font-weight: 600;
    box-shadow: var(--shadow-md);
  }

  .figure { margin-top: 12px; }
  .figure-key {
    font-family: var(--mono); font-size: var(--fs-10); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
  }
  .figure-val {
    font-size: var(--fs-28); font-weight: 600; line-height: 1.15;
    letter-spacing: -0.01em; color: var(--green-ink);
  }
  .figure-sub { font-size: var(--fs-11); color: var(--text-dim); line-height: 1.35; }

  .idhead { grid-column: 2; min-width: 0; }

  .idmeta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }

  .tag {
    display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
    border-radius: 999px; font-size: var(--fs-10); font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .tag-id      { background: var(--surface-sunk); color: var(--text-muted); font-family: var(--mono); }
  .tag-core    { background: var(--accent-soft);  color: var(--accent); }
  .tag-live    { background: var(--green-soft);   color: var(--green-ink); }
  .tag-segment {
    background: transparent; color: var(--text-dim);
    text-transform: none; letter-spacing: 0; font-weight: 400; font-size: var(--fs-12);
  }

  /* The person leads. Three steps of hierarchy, separated by size AND weight
     so they never blur: 40/600 name, 20/500 role, 16/400 description. */
  h1 { margin: 0 0 2px; font-size: var(--fs-40); line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }

  .id-role {
    margin: 0 0 10px; font-size: var(--fs-20); line-height: 1.25;
    font-weight: 500; letter-spacing: -0.01em; color: var(--text);
  }

  .id-line { margin: 0; max-width: 84ch; font-size: var(--fs-16); color: var(--text-muted); }

  .id-mandate { margin-top: 16px; }
  .id-mandate p { margin: 0; max-width: 96ch; font-size: var(--fs-14); line-height: 1.62; color: var(--text); }

  /* ── Blocks ───────────────────────────────────────────────────────── */

  .block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 26px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }

  .block-h {
    margin: 0 0 14px;
    font-family: var(--mono); font-size: var(--fs-11); font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }

  .section-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; }
  h2 { margin: 0; font-size: var(--fs-20); font-weight: 600; letter-spacing: -0.01em; }
  .section-note { font-size: var(--fs-12); color: var(--text-dim); }

  /* ── Today vs with the agent ──────────────────────────────────────
     The contrast IS the argument, so the halves are placed against each other
     rather than in sequence. Neutral versus green: red is reserved for the
     chessboard, and "today" is not an alarm, it is just the status quo. */

  .scene-title { margin: 0 0 14px; font-size: var(--fs-16); font-weight: 600; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

  .half { border-radius: var(--radius-s); padding: 16px 18px; }
  .half p { margin: 0; font-size: var(--fs-14); line-height: 1.6; color: var(--text); }
  .half p + p { margin-top: 10px; }

  .h-today {
    background: var(--surface-sunk);
    border: 1px solid var(--border);
    border-top: 3px solid var(--border-strong);
  }
  .h-agent {
    background: color-mix(in srgb, var(--g-green) 5%, var(--surface));
    border: 1px solid color-mix(in srgb, var(--g-green) 26%, var(--border));
    border-top: 3px solid var(--g-green);
  }

  .half-label {
    font-family: var(--mono); font-size: var(--fs-10); font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 9px;
  }
  .h-today .half-label { color: var(--text-dim); }
  .h-agent .half-label { color: var(--green-ink); }

  .half-foot {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border);
    font-size: var(--fs-12); color: var(--text-dim);
  }
  .half-foot b { color: var(--text-muted); font-weight: 600; }

  /* ── Friction points ──────────────────────────────────────────────── */

  .fold > summary {
    cursor: pointer; list-style: none;
    font-size: var(--fs-14); font-weight: 600; color: var(--text);
    padding: 4px 0;
  }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before {
    content: "\25B8"; display: inline-block; width: 16px;
    color: var(--text-dim); transition: transform 150ms ease;
  }
  .fold[open] > summary::before { transform: rotate(90deg); }
  .fold > summary:hover { color: var(--accent); }

  .friction { margin-top: 14px; display: grid; gap: 10px; }

  .fpoint {
    border-left: 3px solid var(--border-strong);
    background: var(--surface-sunk);
    border-radius: 0 var(--radius-s) var(--radius-s) 0;
    padding: 13px 18px;
  }
  .fpoint .fp-act {
    font-size: var(--fs-12); font-weight: 600; color: var(--text-muted);
    margin-bottom: 5px;
  }
  .fpoint .fp-today { font-size: var(--fs-14); line-height: 1.55; color: var(--text); }
  .fpoint .fp-fail  { font-size: var(--fs-12); line-height: 1.5; color: var(--text-muted); margin-top: 6px; }
  .fpoint .fp-meta  {
    font-family: var(--mono); font-size: var(--fs-10); letter-spacing: 0.05em;
    color: var(--text-dim); margin-top: 7px;
  }

  /* ── Bucket colours ───────────────────────────────────────────────
     A green to grey ramp, reading as "how much of this is ours" -- not a
     warning scale, so no yellow. These once drove a proportional bar at the
     top of the work section; that bar moved to the board. All that is left
     here is the chip on each workflow row. */

  .seg-B1 { background: var(--g-green); }
  .seg-B2 { background: var(--border-strong); }
  .seg-B3 { background: var(--text-dim); }


  .work-list { margin: 12px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }

  .work-row {
    display: grid;
    grid-template-columns: 42px minmax(0, 1fr) 96px 108px 72px;
    gap: 12px; align-items: center;
    padding: 8px 2px; border-bottom: 1px solid var(--border);
    font-size: var(--fs-13);
  }
  .work-code  { font-family: var(--mono); font-size: var(--fs-11); color: var(--text-dim); }
  .work-act   { color: var(--text); }
  .work-freq  { font-size: var(--fs-11); color: var(--text-dim); }
  .work-agent { font-size: var(--fs-11); color: var(--accent); text-align: right; }

  .bucket-chip {
    justify-self: start; padding: 2px 8px; border-radius: 999px;
    font-size: var(--fs-10); font-weight: 600; letter-spacing: 0.04em; color: #FFFFFF;
  }
  .bucket-chip.seg-B2 { color: var(--text-muted); }

  /* ── Squad ────────────────────────────────────────────────────────── */

  /* Cards stretch to a common height per row so their footers land on one
     line -- mining's arrangement, and the reason its grids read as a set
     rather than as a pile. An open card is pulled out of the flow instead
     (grid-column: 1/-1), which is what stops the neighbours being dragged
     tall and leaving a dead column beside the detail. */
  .squad {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }

  .agent {
    display: flex; flex-direction: column;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    transition: box-shadow 200ms ease, border-color 200ms ease, transform 200ms ease;
  }
  /* Border colour is the hover signal, not a bigger shadow. */
  .agent:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .agent.is-open {
    grid-column: 1 / -1;
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
    transform: none;
  }

  .agent-head {
    display: flex; flex-direction: column; justify-content: space-between; gap: 14px;
    flex: 1; width: 100%; padding: 14px 16px; border: 0; border-radius: var(--radius);
    background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }

  .agent-badges { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }

  /* Open, the card is the full width of the grid, and space-between would
     strand the hours pill on the far edge, metres from the ID it qualifies.
     Pair them at the left instead. */
  .agent.is-open .agent-badges { justify-content: flex-start; gap: 12px; }

  /* The registry ID leads. It was previously the last thing on the card, in
     grey, under the launch button -- the wrong end for the one string an
     operator would ever quote back at you.

     It carries the page's blue-to-purple identity gradient, not a near-black
     slab: black is spent on the Gemini Enterprise button, which needs a dark
     ground because the supplied wordmark is white with a blue-gradient spark.
     Two black objects on one card made the ID compete with the launch. */
  .badge-id {
    font-family: var(--mono); font-size: var(--fs-10); font-weight: 700;
    letter-spacing: 0.03em; padding: 3px 9px; border-radius: 5px;
    background: linear-gradient(135deg, var(--g-blue) 0%, var(--g-purple) 100%);
    color: #FFFFFF; white-space: nowrap;
  }

  .agent-title { margin: 0 0 6px; font-size: var(--fs-16); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; }
  .agent-one-line { margin: 0; font-size: var(--fs-13); line-height: 1.45; color: var(--text-muted); }

  .agent-saved {
    display: inline-flex; align-items: baseline; gap: 3px;
    padding: 3px 9px; border-radius: 999px;
    background: var(--green-soft); color: var(--green-ink);
    font-size: var(--fs-12); font-weight: 700; white-space: nowrap;
  }
  .agent-saved small { font-size: var(--fs-10); font-weight: 600; }

  /* ── The value layer ───────────────────────────────────────────────────
     Money leads on the collapsed card because it is the number that travels;
     hours live inside the open card because they are the number that is
     defensible. Every dossier's own value rule says "never multiply into
     enterprise totals -- the customer supplies their own multiplier", so the
     rupee figure is OURS, not the research's, and the page says so out loud
     in .assumptions rather than smuggling it in.

     --money-ink is a darkened companion to --g-green: the brand green reads
     2.89:1 on white and fails AA, this reads 5.11:1 on white and 4.61:1 on
     the sunk panel. Both grounds had to be tested; the obvious mid-greys pass
     one and fail the other. */
  .agent-money {
    --money-ink: #007F3F;
    display: inline-flex; align-items: baseline; gap: 3px;
    font-size: var(--fs-16); font-weight: 700; letter-spacing: -0.01em;
    color: var(--money-ink); white-space: nowrap;
  }
  .agent-money small {
    font-size: var(--fs-10); font-weight: 600; letter-spacing: 0;
    color: var(--text-dim);
  }
  html.theme-dark .agent-money { --money-ink: #35D68A; }

  /* ── The bifurcation ──────────────────────────────────────────────────
     Three terms, one per row, each with a 3px left rule in its own colour
     so the proportions read at a glance without a chart. Zeros are SHOWN,
     greyed, never hidden: a role that legitimately recovers no asset time
     is the evidence that the roles which do are not being inflated. */
  .vbreak {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px dashed var(--border-strong);
  }
  .vbreak-h {
    font-size: var(--fs-10); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 10px;
  }

  .vrow {
    display: grid; grid-template-columns: 118px 88px minmax(0, 1fr);
    align-items: baseline; gap: 12px;
    padding: 7px 0 7px 11px; border-left: 3px solid var(--border-strong);
  }
  .vrow + .vrow { margin-top: 3px; }
  .vrow-key   { font-size: var(--fs-12); font-weight: 600; color: var(--text); }
  .vrow-val   { font-family: var(--mono); font-size: var(--fs-13); font-weight: 700;
                color: var(--text); text-align: right; }
  .vrow-basis { font-size: var(--fs-11); line-height: 1.5; color: var(--text-dim); }

  .v-human { border-left-color: var(--g-blue); }
  .v-asset { border-left-color: var(--g-green); }
  .v-risk  { border-left-color: var(--g-purple); }
  .v-recov { border-left-color: var(--g-cyan); }

  /* An honest zero, rendered as one. */
  .v-zero               { border-left-color: var(--border); }
  .v-zero .vrow-key,
  .v-zero .vrow-val     { color: var(--text-dim); font-weight: 500; }
  .v-zero .vrow-basis   { font-style: italic; }

  .vrow-total {
    margin-top: 8px; padding-top: 10px; padding-left: 11px;
    border-left: 3px solid transparent;
    border-top: 1px solid var(--border-strong);
  }
  .vrow-total .vrow-key { font-weight: 700; }
  .vrow-total .vrow-val { font-size: var(--fs-16); letter-spacing: -0.01em; }

  .vbreak-note {
    margin: 10px 0 0; font-size: var(--fs-11); line-height: 1.6;
    color: var(--text-dim);
  }
  .vbreak-note b { color: var(--text-muted); font-weight: 600; }

  /* ── Squad bucket strip ───────────────────────────────────────────────
     The framework, stated once per persona, above the assumptions and below
     the cards. Same blue/green/purple coding as the in-card breakdown, so
     the eye learns it once and reads it everywhere. */
  .bstrip {
    margin: 26px 0 0; padding: 18px 20px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface);
  }
  .bstrip-h {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
    font-size: var(--fs-11); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .bstrip-total {
    font-family: var(--mono); font-size: var(--fs-13); font-weight: 700;
    letter-spacing: 0; text-transform: none; color: var(--text);
  }

  /* One bar, three lengths. The reader's real question is which of the three
     a role is actually about, and that is a length comparison -- not three
     numbers in a row and certainly not a pie. */
  .bstrip-bar {
    display: flex; height: 8px; border-radius: 4px; overflow: hidden;
    background: var(--border); margin-bottom: 16px;
  }
  .bstrip-seg { display: block; height: 100%; }
  .bstrip-seg.b-human { background: var(--g-blue); }
  .bstrip-seg.b-asset { background: var(--g-green); }
  .bstrip-seg.b-risk  { background: var(--g-purple); }
  .bstrip-seg.b-recov { background: var(--g-cyan); }

  .bstrip-cells {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px;
  }
  .bcell {
    display: grid; grid-template-columns: auto 1fr; gap: 0 8px;
    align-items: baseline;
  }
  .bcell-dot {
    width: 8px; height: 8px; border-radius: 2px; align-self: center;
  }
  .bcell-dot.b-human { background: var(--g-blue); }
  .bcell-dot.b-asset { background: var(--g-green); }
  .bcell-dot.b-risk  { background: var(--g-purple); }
  .bcell-dot.b-recov { background: var(--g-cyan); }
  .bcell-key { font-size: var(--fs-12); font-weight: 600; color: var(--text); }
  .bcell-val {
    grid-column: 2; font-family: var(--mono); font-size: var(--fs-20);
    font-weight: 700; letter-spacing: -0.01em; color: var(--text);
    margin: 2px 0 1px;
  }
  .bcell-sub { grid-column: 2; font-size: var(--fs-11); line-height: 1.45; color: var(--text-dim); }

  /* Zeros stay on the page. A role that legitimately recovers no asset time
     is the evidence that the roles which do are not being inflated. */
  .bcell-zero .bcell-key,
  .bcell-zero .bcell-val { color: var(--text-dim); font-weight: 500; }
  .bcell-zero .bcell-dot { background: var(--border-strong); }
  .bcell-zero .bcell-sub { font-style: italic; }

  @media (max-width: 860px) {
    .bstrip-cells { grid-template-columns: 1fr; gap: 14px; }
  }


  /* ── Agent portfolio ──────────────────────────────────────────────────
     The squad strip above answers "what kind of value is this role".
     This answers "which agent should we build first" -- the same rupees,
     ranked. It is the yardstick, not a forecast: the ordering is the point,
     and the ordering is the thing that survives the operator swapping in
     their own rate, seat count and asset multipliers.

     Segment colours are deliberately the same four as .bstrip-seg. Every
     bar carries the same proportions, because the three role-level levers
     are apportioned by hours-share -- that visual repetition is honest,
     and the note under the chart says so rather than letting a reader
     assume each agent was priced separately. */
  .portfolio { margin: 26px 0 0; }
  .pf-h {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
    font-size: var(--fs-11); font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .pf-total {
    font-family: var(--mono); font-size: var(--fs-13); font-weight: 700;
    letter-spacing: 0; text-transform: none; color: var(--text);
  }

  /* Columns are FIXED, not auto. Each .pf-row is its own grid, so an `auto`
     value column would be sized by its own text -- "₹111.6 Cr" and "₹9.9 Cr"
     would produce different column widths, the bars would be measured against
     different track lengths, and the chart would silently stop being a fair
     comparison. This is the whole reason the chart exists, so it is pinned. */
  .pf-row {
    display: grid; grid-template-columns: 22px minmax(0, 1fr) 86px;
    gap: 2px 10px; align-items: baseline;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .pf-row:last-of-type { border-bottom: 1px solid var(--border); }

  .pf-rank {
    grid-row: 1 / span 3; align-self: start; margin-top: 1px;
    font-family: var(--mono); font-size: var(--fs-12); font-weight: 700;
    color: var(--text-dim); text-align: right;
  }
  .pf-name {
    font-size: var(--fs-12); font-weight: 600; color: var(--text);
    line-height: 1.4;
  }
  .pf-val {
    font-family: var(--mono); font-size: var(--fs-13); font-weight: 700;
    color: var(--text); white-space: nowrap; text-align: right;
  }

  /* Track is always full width; the fill carries the length. The exposed
     track doubles as the "headroom to the leading agent" reading. */
  .pf-bar {
    grid-column: 2 / span 2; display: block; width: 100%; height: 7px;
    margin: 5px 0 3px; border-radius: 4px; overflow: hidden;
    background: var(--border);
  }
  .pf-fill { display: flex; height: 100%; border-radius: 4px; overflow: hidden; }
  .pf-seg { display: block; height: 100%; }
  .pf-seg.b-human { background: var(--g-blue); }
  .pf-seg.b-asset { background: var(--g-green); }
  .pf-seg.b-risk  { background: var(--g-purple); }
  .pf-seg.b-recov { background: var(--g-cyan); }

  .pf-sub {
    grid-column: 2 / span 2;
    font-size: var(--fs-11); line-height: 1.45; color: var(--text-dim);
  }
  .pf-sub b { color: var(--text-muted); font-weight: 600; }

  .pf-note {
    margin: 12px 0 0; font-size: var(--fs-11); line-height: 1.55;
    color: var(--text-dim);
  }
  .pf-note b { color: var(--text-muted); font-weight: 600; }

  @media (max-width: 860px) {
    .pf-row { grid-template-columns: 20px minmax(0, 1fr) 78px; }
    .pf-name { font-size: var(--fs-11); }
  }



  /* ── Assumptions ──────────────────────────────────────────────────────
     Dashed, like every other "not real yet" object on this page. */
  .assumptions {
    margin: 26px 0 0; padding: 16px 18px;
    border: 1px dashed var(--border-strong); border-radius: 10px;
    background: var(--surface);
  }
  .assumptions h4 {
    margin: 0 0 8px; font-size: var(--fs-11); font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim);
  }
  .assumptions p { margin: 0 0 8px; font-size: var(--fs-12); line-height: 1.6; color: var(--text-muted); }
  .assumptions p:last-child { margin-bottom: 0; }
  .assumptions b { color: var(--text); font-weight: 600; }
  .assumptions code {
    font-family: var(--mono); font-size: var(--fs-11);
    color: var(--text-muted); background: var(--green-soft);
    padding: 1px 5px; border-radius: 4px;
  }

  /* Dashed, because the footer separates the claim from the evidence rather
     than closing the card off. */
  .agent-foot-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding-top: 10px; border-top: 1px dashed var(--border-strong);
  }

  .agent-value {
    font-size: var(--fs-11); font-weight: 600; line-height: 1.35;
    color: var(--green-ink); min-width: 0;
  }

  .agent-open { font-size: var(--fs-12); font-weight: 600; color: var(--accent); white-space: nowrap; }
  .agent-open::after { content: "Open \203A"; }
  .agent.is-open .agent-open::after { content: "Close \203A"; }

  /* Open, the card owns the full row, so the detail can run in two columns:
     the mechanism on the left, the governance and the launch on the right. */
  .agent-detail { display: none; padding: 0 16px 16px; }
  .agent.is-open .agent-detail {
    display: grid;
    grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
    gap: 0 28px;
    align-items: start;
  }
  .detail-main, .detail-side { min-width: 0; }

  @media (max-width: 900px) {
    .agent.is-open .agent-detail { grid-template-columns: 1fr; gap: 18px; }
  }

  .agent-friction {
    margin: 0 0 14px; padding-left: 11px;
    border-left: 2px solid var(--g-green);
    font-size: var(--fs-13); line-height: 1.5; color: var(--text);
  }

  .spec { border-top: 1px solid var(--border); padding-top: 12px; }
  .spec-row { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 6px 0; font-size: var(--fs-13); }
  .spec-key {
    font-size: var(--fs-10); font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-dim); padding-top: 3px;
  }
  .spec-val { color: var(--text-muted); min-width: 0; }

  /* The two blocks that make an agent governable rather than merely useful.
     Dashed, not coloured: this is a boundary, and none of these agents is
     deployed yet. Yellow and red belong to the chessboard. */
  .guard {
    margin-top: 12px; padding: 11px 13px;
    border-radius: var(--radius-s);
    border: 1px dashed var(--border-strong);
    background: var(--surface-sunk);
  }

  .guard-key {
    display: block; margin-bottom: 3px;
    font-size: var(--fs-10); font-weight: 700; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--text-muted);
  }
  .guard-val { font-size: var(--fs-13); color: var(--text); }

  .hours-line { margin-top: 12px; font-size: var(--fs-12); color: var(--text-dim); }
  .hours-line b { color: var(--text-muted); font-weight: 600; }

  .agent-foot { margin-top: 14px; }

  /* The official wordmark is drawn in white -- it was authored for a dark
     hero. So the button carries a Grey 1200 surface and the mark is used
     exactly as supplied, rather than recoloured. */
  .ge-launch {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; border: 1px solid transparent; border-radius: 10px;
    background: var(--g-grey-1200); text-decoration: none;
    transition: box-shadow 150ms ease, transform 150ms ease, background 150ms ease;
  }
  .ge-launch:hover { background: #1D1F26; box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .ge-mark  { height: 14px; width: auto; flex: none; display: block; }
  .ge-cta   { flex: 1; text-align: right; font-size: var(--fs-12); font-weight: 600; color: #FFFFFF; white-space: nowrap; }
  .ge-arrow { font-size: var(--fs-14); color: #FFFFFF; flex: none; }

  /* The button opens the workspace the estate is published into, not a
     per-agent endpoint. Say so, quietly, rather than implying a deployment
     that does not exist yet. */
  .ge-note {
    display: block; margin-top: 7px;
    font-size: var(--fs-10); line-height: 1.4; color: var(--text-dim);
  }

  html.theme-dark .ge-launch { background: #1D1F26; border-color: rgba(255, 255, 255, 0.14); }
  html.theme-dark .ge-launch:hover { background: #262932; }

  /* ── Limits ───────────────────────────────────────────────────────── */

  .limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }

  .narr-h3 {
    margin: 0 0 9px; font-size: var(--fs-12); font-weight: 600;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-dim);
  }

  .no-list { margin: 0; padding: 0; list-style: none; }
  .no-list li {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px;
    padding: 7px 0; border-bottom: 1px solid var(--border); font-size: var(--fs-13);
  }
  .no-list li:last-child { border-bottom: 0; }
  .no-list span { color: var(--text-muted); }
  .no-list b    { color: var(--text); font-weight: 600; text-align: right; }

  .the-line p { margin: 0; font-size: var(--fs-14); line-height: 1.6; color: var(--text); }

  /* ── Footer ───────────────────────────────────────────────────────── */

  .provenance {
    margin: 30px 0 70px; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: var(--fs-12); color: var(--text-dim);
  }
  .provenance b { color: var(--text-muted); font-weight: 600; }

  .empty { padding: 60px 0; color: var(--text-dim); font-size: var(--fs-16); }

  /* ── Responsive ───────────────────────────────────────────────────── */

  @media (max-width: 1000px) {
    .split { grid-template-columns: 1fr; }
  }

  @media (max-width: 720px) {
    .idcard { grid-template-columns: 1fr; row-gap: 16px; }
    .portrait-col, .idhead { grid-column: 1; }
    .portrait, .portrait-mono { width: 88px; height: 88px; }
    h1 { font-size: var(--fs-28); }
    .id-role { font-size: var(--fs-16); }
    .mast-kicker, .mast-cta { display: none; }
    .fsearch { margin-left: 0; width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
