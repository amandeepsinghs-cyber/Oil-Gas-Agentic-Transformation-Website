    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    // IntersectionObserver for active stage indicator
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const idx = stages.indexOf(entry.target);
          if (idx !== -1) {
            currentIdx = idx;
            const numStr = String(idx).padStart(2, '0');
            const totalStr = String(stages.length - 1).padStart(2, '0');
            const counter = document.getElementById('slide-progress-counter');
            if (counter) counter.innerText = `${numStr} / ${totalStr}`;

            if (pill) pill.innerText = stageTitles[idx] || `STAGE ${numStr}`;
          }
        }
      });

    stages.forEach(s => observer.observe(s));

        if (imgFortified) imgFortified.style.opacity = '0';
        if (imgBaseline) imgBaseline.style.opacity = '1';
        if (headlineMain) {
          headlineMain.innerText = 'A major incident is never a single failure.';
        }
        if (headlineAccent) {
          headlineAccent.style.color = '#94A3B8';
          headlineAccent.innerText = 'It’s the quiet alignment of invisible gaps.';
          headlineAccent.style.marginBottom = '10px';
        }
        if (narrativeLead) {
          narrativeLead.style.display = 'block';
          narrativeLead.innerHTML = 'Rooted in <strong style="color: #FFF;">Prof. James Reason’s System Safety model</strong>: disasters in high-consequence operations rarely stem from a single colossal error, but from routine friction and unmonitored seams lining up across siloed disciplines.';
        }
        if (statusDot) {
          statusDot.style.background = '#F59E0B';
          statusDot.style.boxShadow = 'none';
        }
        if (statusText) {
          statusText.style.color = '#94A3B8';
          statusText.innerText = 'Latent Hazard Path: Unmonitored Cross-Discipline Vulnerabilities';
        }

        // Tier 1 Reset
        if (tiers[0].card) {
          tiers[0].card.style.borderColor = 'rgba(255, 255, 255, 0.08)';
          tiers[0].card.style.background = 'rgba(15, 23, 42, 0.45)';
        }
        if (tiers[0].badge) {
          tiers[0].badge.style.background = 'rgba(255, 255, 255, 0.06)';
          tiers[0].badge.style.borderColor = 'rgba(255, 255, 255, 0.12)';
          tiers[0].badge.style.color = '#94A3B8';
          tiers[0].badge.innerText = 'Vulnerability 1';
        }
        if (tiers[0].title) tiers[0].title.innerText = 'Legacy Mudlog in PDF Archive';
        if (tiers[0].metric) {
          tiers[0].metric.style.color = '#F59E0B';
          tiers[0].metric.innerText = '2004 Offset Well · Unindexed Scan';
        }
        if (tiers[0].desc) tiers[0].desc.innerText = 'A critical gas kick from a 2004 offset well remained buried in an unindexed PDF scan, unread during well planning.';

        // Tier 2 Reset
        if (tiers[1].card) {
          tiers[1].card.style.borderColor = 'rgba(255, 255, 255, 0.08)';
          tiers[1].card.style.background = 'rgba(15, 23, 42, 0.45)';
        }
        if (tiers[1].badge) {
          tiers[1].badge.style.background = 'rgba(255, 255, 255, 0.06)';
          tiers[1].badge.style.borderColor = 'rgba(255, 255, 255, 0.12)';
          tiers[1].badge.style.color = '#94A3B8';
          tiers[1].badge.innerText = 'Vulnerability 2';
        }
        if (tiers[1].title) tiers[1].title.innerText = 'Wireline Cable Stretch';
        if (tiers[1].metric) {
          tiers[1].metric.style.color = '#F59E0B';
          tiers[1].metric.innerText = '1.48m Uncalibrated Discrepancy';
        }
        if (tiers[1].desc) tiers[1].desc.innerText = 'Mechanical cable stretch shifted logging depth by 1.48m. Approximated manually, placing the caprock 1.5m deeper than reality.';

        // Tier 3 Reset
        if (tiers[2].card) {
          tiers[2].card.style.borderColor = 'rgba(255, 255, 255, 0.08)';
          tiers[2].card.style.background = 'rgba(15, 23, 42, 0.45)';
        }
        if (tiers[2].badge) {
          tiers[2].badge.style.background = 'rgba(255, 255, 255, 0.06)';
          tiers[2].badge.style.borderColor = 'rgba(255, 255, 255, 0.12)';
          tiers[2].badge.style.color = '#94A3B8';
          tiers[2].badge.innerText = 'Vulnerability 3';
        }
        if (tiers[2].title) tiers[2].title.innerText = 'Rig Crew Changeover';
        if (tiers[2].metric) {
          tiers[2].metric.style.color = '#F59E0B';
          tiers[2].metric.innerText = '4-Hour Communication Lag';
        }
        if (tiers[2].desc) tiers[2].desc.innerText = 'Updated depth warnings were lost in an email handover at 3:00 AM. The rig crew continued drilling ahead unaware of the danger window.';

        // Tier 4 Reset
        if (tiers[3].card) {
          tiers[3].card.style.borderColor = 'rgba(245, 158, 11, 0.3)';
          tiers[3].card.style.background = 'rgba(15, 23, 42, 0.45)';
        }
        if (tiers[3].badge) {
          tiers[3].badge.style.background = 'rgba(245, 158, 11, 0.15)';
          tiers[3].badge.style.borderColor = 'rgba(245, 158, 11, 0.35)';
          tiers[3].badge.style.color = '#F59E0B';
          tiers[3].badge.innerText = 'CRITICAL HAZARD';
        }
        if (tiers[3].title) tiers[3].title.innerHTML = '<span style="color: #FFF;">Casing Shoe Misplacement</span>';
        if (tiers[3].metric) {
          tiers[3].metric.style.color = '#F59E0B';
          tiers[3].metric.innerText = 'Cumulative 2m Error · Gas Sand Landed';
        }
        if (tiers[3].desc) {
          tiers[3].desc.style.color = '#94A3B8';
          tiers[3].desc.innerText = 'The casing shoe seated directly into the fractured gas sand rather than solid rock, causing an uncontrollable kick and stuck drillstring.';
        }
      }
    }

    function setWorkshopAsset(asset) {
      const btnBarmer = document.getElementById('s14-btn-barmer');
      const btnMumbai = document.getElementById('s14-btn-mumbai');
      const btnRefinery = document.getElementById('s14-btn-refinery');
      const title = document.getElementById('s14-asset-title');
      const desc = document.getElementById('s14-asset-desc');
      const roi = document.getElementById('s14-asset-roi');

      const resetBtns = () => {
        [btnBarmer, btnMumbai, btnRefinery].forEach(b => {
          if (b) {
            b.style.background = 'transparent';
            b.style.color = 'var(--text-dim)';
          }
        });
      };

      resetBtns();

      if (asset === 'mumbai') {
        if (btnMumbai) {
          btnMumbai.style.background = 'rgba(0, 163, 255, 0.25)';
          btnMumbai.style.color = '#FFF';
        }
        if (title) title.innerText = 'Mumbai Offshore // Deepwater Drilling & Platform Operations';
        if (desc) desc.innerText = 'Target Seams: Deepwater drilling kick early detection & Casing shoe pressure margin advisor.';
        if (roi) roi.innerText = 'Expected ROI: ₹110–180 Cr / yr';
      } else if (asset === 'refinery') {
        if (btnRefinery) {
          btnRefinery.style.background = 'rgba(0, 210, 180, 0.25)';
          btnRefinery.style.color = '#FFF';
        }
        if (title) title.innerText = 'Flagship Refinery // CDU & Petrochemical Processing Units';
        if (desc) desc.innerText = 'Target Seams: CDU crude blend assay optimizer & Heat exchanger furnace fouling prediction.';
        if (roi) roi.innerText = 'Expected ROI: ₹140–250 Cr / yr';
      } else {
        if (btnBarmer) {
          btnBarmer.style.background = 'rgba(245, 158, 11, 0.25)';
          btnBarmer.style.color = '#FFF';
        }
        if (title) title.innerText = 'Barmer Basin // Upstream E&P Exploration & Development';
        if (desc) desc.innerText = 'Target Seams: Wireline logging cable stretch (+1.48m shift) & Dark-data historical mudlog PDF ingestion.';
        if (roi) roi.innerText = 'Expected ROI: ₹65–95 Cr / yr';
      }
    }
  </script>
